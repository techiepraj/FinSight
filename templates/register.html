{% extends "base.html" %} {% block title %}Create account{% endblock %} {% block
auth %}
<div class="auth-card">
  <div class="brand"><span class="brand-mark">F</span> FinSight</div>
  <h1>Create your account</h1>
  <p class="muted">Start tracking your money in minutes.</p>

  {% include "_flash.html" %}

  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <label for="name">Full name</label>
    <input
      id="name"
      name="name"
      type="text"
      value="{{ name or '' }}"
      required
      autofocus
    />

    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      value="{{ email or '' }}"
      required
    />

    <label for="password"
      >Password <small>(at least 8 characters)</small></label
    >
    <input id="password" name="password" type="password" required />

    <label for="confirm_password">Confirm password</label>
    <input
      id="confirm_password"
      name="confirm_password"
      type="password"
      required
    />

    <button class="btn btn-primary" type="submit">Create account</button>
  </form>

  <p class="auth-foot">
    Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>
  </p>
</div>
{% endblock %}
