{% extends "base.html" %} {% block title %}Log in{% endblock %} {% block auth %}
<div class="auth-card">
  <div class="brand"><span class="brand-mark">F</span> FinSight</div>
  <h1>Welcome back</h1>
  <p class="muted">Log in to see your finances.</p>

  {% include "_flash.html" %}

  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      value="{{ email or '' }}"
      required
      autofocus
    />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required />

    <button class="btn btn-primary" type="submit">Log in</button>
  </form>

  <p class="auth-foot">
    New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
  </p>
</div>
{% endblock %}
